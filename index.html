<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dokkyo-Info. | Calendar</title>
    <link rel="stylesheet" , href="./template.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=M+PLUS+Rounded+1c&family=Noto+Sans+JP:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Zen+Kaku+Gothic+New&display=swap"
        rel="stylesheet">
    <link href="https://use.fontawesome.com/releases/v6.5.0/css/all.css" rel="stylesheet">
</head>

<body>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-55KCNS8MEF"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-55KCNS8MEF');
    </script>
    <header class="header">
        <nav class="head-logo">
            <a href="#">
                Dokkyo-Info.
            </a>
        </nav>
    </header>

    <!-- ここから個別の内容 -->
    <section class="calenderSection">
        <div class="calendarTitle">
            <h1 class="title">イベントカレンダー</h1>
        </div>
        <div class="titleExplain">
            <p class="explainText">このサイトは現在PCに対応しておりません。</p>
        </div>
        <div class="calendarHeader">
            <button id="prevMonth">＜</button>
            <h2 id="currentMonth"></h2>
            <button id="nextMonth">＞</button>
        </div>

        <section class="calender">
            <section class="calenderMonth"></section>
        </section>
    </section>


    <!-- ここまで個別の内容 -->

    <footer class="footer">
        <section class="footer-right">
            <p class="right">©︎2025 Dokkyo-Info.</p>
        </section>
    </footer>

    <script src="./system.js"></script>
</body>

</html>
